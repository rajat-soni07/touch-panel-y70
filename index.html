<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' file: data: https://cdn.discordapp.com; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Touch Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="pager" id="pager">
    <section class="page stats">
      <div class="row two">
        <div class="stat">
          <div class="name" id="cpu-name">CPU</div>
          <div class="num"><span id="cpu-temp">–</span><sup class="deg">°</sup></div>
          <div class="sub">CPU temperature</div>
        </div>
        <div class="stat">
          <div class="name" id="gpu-name">GPU</div>
          <div class="num"><span id="gpu-temp">–</span><sup class="deg">°</sup></div>
          <div class="sub">GPU temperature</div>
        </div>
      </div>

      <div class="row two">
        <div class="stat">
          <div class="name" id="cpu-name2">CPU</div>
          <div class="ring" id="cpu-ring">
            <svg viewBox="0 0 100 100">
              <mask id="cpu-fill"><circle class="fill" cx="50" cy="50" r="45" pathLength="100"/></mask>
              <circle class="track" cx="50" cy="50" r="45" pathLength="100"/>
              <circle class="arc" cx="50" cy="50" r="45" pathLength="100" mask="url(#cpu-fill)"/>
            </svg>
            <div class="ring-text">
              <div class="num"><span id="cpu-load">–</span><sup>%</sup></div>
              <div class="sub">CPU</div>
            </div>
          </div>
        </div>
        <div class="stat">
          <div class="name" id="gpu-name2">GPU</div>
          <div class="ring" id="gpu-ring">
            <svg viewBox="0 0 100 100">
              <mask id="gpu-fill"><circle class="fill" cx="50" cy="50" r="45" pathLength="100"/></mask>
              <circle class="track" cx="50" cy="50" r="45" pathLength="100"/>
              <circle class="arc" cx="50" cy="50" r="45" pathLength="100" mask="url(#gpu-fill)"/>
            </svg>
            <div class="ring-text">
              <div class="num"><span id="gpu-load">–</span><sup>%</sup></div>
              <div class="sub">GPU</div>
            </div>
          </div>
        </div>
      </div>

      <div class="row three">
        <div class="stat small">
          <div class="name">Total memory</div>
          <div class="num"><span id="ram">–</span><sup>%</sup></div>
          <div class="sub">Memory usage</div>
        </div>
        <div class="stat small">
          <div class="name">FPS</div>
          <div class="num"><span id="fps">–</span></div>
          <div class="sub">Frames per second</div>
        </div>
        <div class="stat small">
          <div class="name" id="disk-name">Disk</div>
          <div class="num"><span id="disk">–</span><sup>%</sup></div>
          <div class="sub">Disk activity</div>
        </div>
      </div>
    </section>

    <section class="page buttons-page">
      <div class="grid" id="grid"></div>

      <div class="discord" id="discord">
        <div class="dc-head">
          <svg class="dc-logo" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.865-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.74 19.74 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .078-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.099.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
          <div class="dc-titles">
            <div class="dc-title" id="dc-title">Discord</div>
            <div class="dc-subtitle" id="dc-subtitle"></div>
          </div>
        </div>
        <div class="dc-members" id="dc-members"></div>
        <div class="dc-actions">
          <button class="dc-btn" id="dc-mute" data-action="mute"></button>
          <button class="dc-btn" id="dc-deaf" data-action="deaf"></button>
        </div>
      </div>
    </section>
    </div>

    <div class="dots" id="dots"><i data-page="0"></i><i data-page="1"></i></div>

    <!-- Steam "Recently played" sheet: opened by the dock's Steam icon -->
    <div class="sheet-scrim" id="games-scrim"></div>
    <div class="games-sheet" id="games">
      <div class="games-head">
        <div class="games-title">Recently played</div>
        <button class="games-open" id="games-open">Open Steam</button>
      </div>
      <div class="games-grid" id="games-grid"></div>
    </div>

    <nav class="dock" id="dock"></nav>
  </main>

  <div class="toast" id="toast"></div>

  <script src="renderer.js"></script>
</body>
</html>
